services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: 5000
      MODEL_PATH: /app/training/runs/base32_ep100/best.pt
      DB_PATH: /app/data/history.db
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      HOST: 0.0.0.0
      FRONTEND_PORT: 8000
      BACKEND_URL: http://backend:5000
    ports:
      - "8000:8000"
    depends_on:
      - backend

volumes:
  backend-data:
